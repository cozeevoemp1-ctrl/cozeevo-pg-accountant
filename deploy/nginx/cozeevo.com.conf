# /etc/nginx/sites-available/cozeevo.com   (symlink into sites-enabled)
#
# Tenant-facing host. Serves the onboarding form and NOTHING else — no PWA, no
# API surface, no admin routes. A customer never sees an app or API hostname
# (BRAIN 15a).
#
# Run certbot AFTER the DNS A record resolves:
#   certbot --nginx -d cozeevo.com -d www.cozeevo.com
# Certbot rewrites this file to add the 443 block and the http->https redirect.

server {
    listen 80;
    server_name cozeevo.com www.cozeevo.com;

    client_max_body_size 200M;      # KYC photo uploads

    # The form itself
    location /join/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ONLY the three endpoints the tenant form calls, matched on a UUID token:
    #   GET  /api/onboarding/<uuid>            load the form's data
    #   POST /api/onboarding/<uuid>/extract-id ID OCR
    #   POST /api/onboarding/<uuid>/submit     submit the form
    # The same /api/onboarding prefix also holds STAFF endpoints — /admin/*,
    # /create, /direct-checkin, /approve, /manual-checkin, /staff-signature.
    # They are auth-protected, but they must not be reachable from the hostname
    # customers hold, so this regex excludes them: anything not matching falls
    # through to `location /` and 404s.
    location ~ "^/api/onboarding/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(/extract-id|/submit)?$" {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The form's logo
    location = /static/logo.svg {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else on this hostname is closed. Replace with the marketing
    # site later if one is built — it can live here without touching the above.
    location / {
        return 404;
    }
}
