<!doctype html>
<html><head><meta charset="utf-8"><title>Help Desk chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 22px/1.38 "Segoe UI", system-ui, sans-serif; color: #111b21; background: #d1d7db; }
  .app { display: flex; height: calc(100vh / var(--z, 1)); background: #fff; }
  .side { width: 360px; border-right: 1px solid #e9edef; display: flex; flex-direction: column; }
  .side header { height: 60px; background: #f0f2f5; display: flex; align-items: center; padding: 0 16px; font-weight: 600; font-size: 17px; }
  .search { margin: 8px 12px; background: #f0f2f5; border-radius: 8px; height: 36px; padding: 0 14px; display: flex; align-items: center; color: #8696a0; font-size: 14px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #f0f2f5; }
  .av { width: 46px; height: 46px; border-radius: 50%; background: #EF1F9C; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
  .item .n { font-weight: 600; font-size: 16px; }
  .item .p { color: #667781; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .main header { height: 84px; background: #f0f2f5; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-left: 1px solid #e9edef; }
  .main header .av { width: 56px; height: 56px; font-size: 20px; }
  .main header .n { font-weight: 600; font-size: 24px; }
  .main header .s { font-size: 18px; color: #667781; }
  .tag { margin-left: auto; font-size: 18px; color: #667781; background: #fff; border: 1px solid #e9edef; border-radius: 12px; padding: 3px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 22px 4% 14px; background: #efeae2; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
  .b { max-width: 72%; padding: 10px 14px 26px; border-radius: 8px; position: relative; box-shadow: 0 1px .5px rgba(11,20,26,.13); white-space: normal; animation: pop .22s ease-out; }
  .b .t { position: absolute; right: 12px; bottom: 5px; font-size: 15px; color: #667781; }
  .out { align-self: flex-end; background: #d9fdd3; }
  .in { align-self: flex-start; background: #fff; }
  .typing { align-self: flex-start; background: #fff; border-radius: 8px; padding: 10px 14px; display: flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8696a0; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s } .typing i:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 50% { opacity: .3 } }
  @keyframes pop { from { transform: translateY(6px); opacity: 0 } }
  footer { height: 84px; background: #f0f2f5; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
  #box { flex: 1; height: 58px; border-radius: 8px; border: 0; padding: 0 14px; font: inherit; font-size: 22px; outline: none; background: #fff; }
  .send { width: 58px; height: 58px; border-radius: 50%; background: #EF1F9C; display: grid; place-items: center; }
  .send::after { content: ''; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
  /* phone layout: wa.html?m=1 (record at 390x844 css, zoom via ?z) */
  body.m .side { display: none; }
  body.m { font-size: 17px; }
  body.m .main header { height: 64px; padding: 0 12px; }
  body.m .main header .av { width: 40px; height: 40px; font-size: 15px; }
  body.m .main header .n { font-size: 18px; } body.m .main header .s { font-size: 13px; } body.m .tag { font-size: 12px; }
  body.m #log { padding: 14px 10px 10px; }
  body.m .b { max-width: 86%; padding: 7px 10px 20px; } body.m .b .t { font-size: 11px; }
  body.m footer { height: 64px; padding: 0 10px; } body.m #box { height: 44px; font-size: 17px; } body.m .send { width: 44px; height: 44px; }
</style></head>
<body>
<div class="app">
  <aside class="side">
    <header>Chats</header>
    <div class="search">Search</div>
    <div class="item"><div class="av">HD</div><div><div class="n">Help Desk</div><div class="p" id="prev">Staff assistant</div></div></div>
  </aside>
  <section class="main">
    <header><div class="av">HD</div><div><div class="n">Help Desk</div><div class="s">staff assistant</div></div><div class="tag">Test data</div></header>
    <div id="log"></div>
    <footer><input id="box" placeholder="Type a message" autocomplete="off"><div class="send"></div></footer>
  </section>
</div>
<script>
const Q = new URLSearchParams(location.search), Z = +(Q.get("z") || 1.5);
document.body.style.zoom = Z; document.documentElement.style.setProperty("--z", Z);
if (Q.get("m")) document.body.classList.add("m");
// Each sent message goes to the REAL bot code (local sandbox, synthetic data) via /bot.
const log = document.getElementById('log'), box = document.getElementById('box');
let clock = 10 * 60 + 2;
const stamp = () => { const h = Math.floor(clock / 60), m = clock % 60; clock += 1; return `${h}:${String(m).padStart(2, '0')}`; };
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const wa = s => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>').replace(/\n/g, '<br>');
function add(cls, html) {
  const d = document.createElement('div'); d.className = 'b ' + cls; d.innerHTML = html + `<span class="t">${stamp()}</span>`;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
window.sendMsg = async (m) => {
  add('out', wa(m)); box.value = '';
  const ty = document.createElement('div'); ty.className = 'typing'; ty.innerHTML = '<i></i><i></i><i></i>';
  log.appendChild(ty); log.scrollTop = log.scrollHeight;
  const [r] = await Promise.all([fetch('/bot', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: m }) }).then(x => x.json()),
                                 new Promise(res => setTimeout(res, 550))]);
  ty.remove();
  add('in', wa(r.reply || ''));
  document.getElementById('prev').textContent = (r.reply || '').replace(/\*/g, '').split('\n')[0];
  window.__lastReply = r.reply;
};
box.addEventListener('keydown', e => { if (e.key === 'Enter' && box.value.trim()) window.sendMsg(box.value.trim()); });
</script>
</body></html>
