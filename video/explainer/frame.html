<!doctype html>
<html><head><meta charset="utf-8"><title>Frame</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
// One full-size frame: frame.html?t=<seconds>
const t = parseFloat(new URLSearchParams(location.search).get('t') || '0');
const ctx = document.getElementById('c').getContext('2d');
document.fonts.ready.then(loadMedia).then(() => prepare(t)).then(() => { render(ctx, t); window.__done = true; });
</script></body></html>
